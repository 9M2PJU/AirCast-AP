[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aircast-ap"
version = "1.0.2"
description = "Modern GTK4 + Libadwaita Wi-Fi 6 Access Point & Hotspot Manager for Linux"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "9M2PJU", email = "9m2pju@hamradio.my"}]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/9M2PJU/AirCast-AP"
Repository = "https://github.com/9M2PJU/AirCast-AP"

[project.scripts]
aircast-ap = "aircast_ap.cli:main"

[tool.setuptools.packages.find]
include = ["aircast_ap*"]
